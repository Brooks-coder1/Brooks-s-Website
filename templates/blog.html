{% extends 'base.html' %}
{% block title %}Blog{% endblock %}

{% block content %}
<style>
    :root {
        --bg: #0f1117;
        --card: #171a23;
        --accent: #7c9cff;
        --text: #ffffff;
        --muted: #9aa0a6;
        --border: #262b38;
    }

    body {
        background: var(--bg);
        color: var(--text);
    }

    .blog-wrapper {
        max-width: 1100px;
        margin: 120px auto;
        padding: 0 18px;
    }

    .blog-title {
        text-align: center;
        font-size: 2.6rem;
        margin-bottom: 35px;
        letter-spacing: 1px;
    }

    .posts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
    }

    .post-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px 22px 20px;
        transition: all .25s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .post-card:hover {
        transform: translateY(-5px);
        border-color: var(--accent);
        box-shadow: 0 12px 28px rgba(0, 0, 0, .5);
    }

    .post-title {
        font-size: 1.4rem;
        margin: 0 0 10px 0;
        line-height: 1.4;
    }

    .post-title a {
        text-decoration: none;
        color: var(--text);
    }

    .post-title a:hover {
        color: var(--accent);
    }

    .post-meta {
        color: var(--muted);
        font-size: .88rem;
        margin-top: auto;
    }

    /* Tablet */
    @media(max-width:900px) {
        .blog-title {
            font-size: 2.2rem
        }
    }

    /* Mobile */
    @media(max-width:600px) {
        .blog-wrapper {
            margin: 25px auto;
            padding: 0 12px
        }

        .blog-title {
            font-size: 1.9rem;
            margin-bottom: 25px
        }

        .post-card {
            padding: 18px
        }

        .post-title {
            font-size: 1.15rem
        }

        .post-meta {
            font-size: .8rem
        }
    }

    /* Small phones */
    @media(max-width:380px) {
        .post-title {
            font-size: 1.05rem
        }
    }
</style>

<form action="/search-results" method="get" class="search-container" role="search">
  <label for="query" style="display: none;">Search our site</label>
  <input type="search" id="query" name="q" placeholder="Search..." aria-label="Search through site content">
  <button type="submit">Search</button>
</form>



<div class="blog-wrapper">
    <h1 class="blog-title">Blog</h1>

    <div class="posts-grid">
        {% for p in posts %}
        <div class="post-card">
            <h2 class="post-title">
                <a href="/post/{{p[0]}}">{{p[1]}}</a>
            </h2>
            <div class="post-meta">{{p[3]}}</div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}

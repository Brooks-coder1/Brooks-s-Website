{% extends 'base.html' %}
{% block title %}{{post[1]}} | Brooks{% endblock %}

{% block content %}

<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{post[1]}}</h1>
        <div class="post-line"></div>
    </header>

    <section class="post-content">
        {{post[2] | safe}}
    </section>
</article>
<style>
    /* Page background */
body{
    background:#0f172a;
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

/* Article container */
.post{
    max-width: 760px;
    margin: 60px auto;
    padding: 40px 26px 60px;
    background:#020617;
    border-radius:18px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

/* Header */
.post-header{
    margin-bottom:40px;
}

.post-title{
    font-size:clamp(28px,4vw,46px);
    line-height:1.2;
    font-weight:800;
    color:#f8fafc;
    letter-spacing:-0.02em;
}

.post-line{
    width:70px;
    height:4px;
    margin-top:16px;
    border-radius:6px;
    background: white;
}

/* Content typography */
.post-content{
    font-size:clamp(16px,1.2vw,19px);
    line-height:1.9;
    color:#e2e8f0;
}

/* Paragraph spacing */
.post-content p{
    margin:20px 0;
}

/* Headings inside article */
.post-content h2{
    margin-top:48px;
    margin-bottom:12px;
    font-size:28px;
    color:#38bdf8;
}

.post-content h3{
    margin-top:36px;
    font-size:22px;
    color:#ffffff;
}

/* Lists */
.post-content ul,
.post-content ol{
    padding-left:26px;
    margin:18px 0;
}

.post-content li{
    margin:8px 0;
}

/* Images */
.post-content img{
    width:100%;
    border-radius:14px;
    margin:28px 0;
}

/* Code blocks */
.post-content pre{
    background:#000814;
    padding:16px;
    border-radius:12px;
    overflow-x:auto;
    margin:25px 0;
}

.post-content code{
    background:#020617;
    padding:3px 6px;
    border-radius:6px;
    font-size:14px;
}

/* Quote */
.post-content blockquote{
    border-left:4px solid #ffffff;
    padding:10px 16px;
    margin:24px 0;
    color:#cbd5f5;
    background:#020617;
    border-radius:8px;
}

/* Links */
.post-content a{
    color:#f97316;
    text-decoration:none;
    border-bottom:1px dashed #f97316;
}

/* -------- Mobile optimization -------- */
@media (max-width: 600px){

    .post{
        margin:50px 12px;
        padding:26px 18px 40px;
        border-radius:14px;
    }

    .post-content{
        line-height:1.8;
    }

    .post-content h2{
        font-size:24px;
    }

    .post-content h3{
        font-size:20px;
    }
}

</style>

{% endblock %}
